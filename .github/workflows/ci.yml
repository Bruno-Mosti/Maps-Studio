name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-22.04, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install display and Tk libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q
