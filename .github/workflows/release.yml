name: Build and release

# Push a tag such as v2.0.0 to build both platforms and publish a GitHub Release.
# "Run workflow" (manual) builds the downloads without publishing a release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm MapsStudio.spec
      - name: Smoke-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MapsStudio.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README-TEAM.txt dist\README.txt
          Compress-Archive -Path dist\MapsStudio.exe, dist\README.txt -DestinationPath out\MapsStudio-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04   # older glibc, so the binary also runs on newer distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb libtk8.6
      - run: python -m pip install -r requirements-dev.txt
      - run: xvfb-run -a python -m pytest -q
      - run: python -m PyInstaller --clean --noconfirm MapsStudio.spec
      - run: xvfb-run -a dist/MapsStudio --smoke-test
      - name: Package
        run: |
          mkdir -p out pkg/MapsStudio
          cp dist/MapsStudio pkg/MapsStudio/
          cp README-TEAM.txt pkg/MapsStudio/README.txt
          tar -C pkg -czf out/MapsStudio-Linux-x64.tar.gz MapsStudio
          packaging/linux/build-deb.sh
          cp dist/*.deb out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A release created in the web UI may already exist when the tag-push build finishes.
            gh release upload "$GITHUB_REF_NAME" files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" files/* --title "Maps Studio $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
          fi
